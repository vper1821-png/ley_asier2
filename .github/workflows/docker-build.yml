name: Construir y Publicar Imágenes Docker

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: docker.io
  IMAGE_BACKEND: ${{ secrets.DOCKER_USERNAME }}/invisia-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKER_USERNAME }}/invisia-frontend
  IMAGE_AGENT: ${{ secrets.DOCKER_USERNAME }}/invisia-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir y subir Backend
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.backend
        push: true
        tags: ${{ env.IMAGE_BACKEND }}:latest

    - name: Construir y subir Frontend
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.frontend
        push: true
        tags: ${{ env.IMAGE_FRONTEND }}:latest

    - name: Construir y subir Agente
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.agent
        push: true
        tags: ${{ env.IMAGE_AGENT }}:latest
