name: Build and Push Docker Images to GHCR

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Permite ejecutarlo manualmente desde la web

env:
  REGISTRY: ghcr.io
  # Nota: github.repository será "ey_asier2" (o el nombre que tenga tu repo)
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  #AGENT_IMAGE: ghcr.io/${{ github.repository }}/agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Necesario para subir a GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login a GHCR usando el GITHUB_TOKEN (no requiere secrets adicionales)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend-node
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-react
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Agent Go
      #- name: Build and push Agent
       # uses: docker/build-push-action@v5
       # with:
       #   context: ./agent-go
        #  push: true
       #   tags: |
        #    ${{ env.AGENT_IMAGE }}:latest
       #     ${{ env.AGENT_IMAGE }}:${{ github.sha }}
      #    cache-from: type=gha
      #    cache-to: type=gha,mode=max
